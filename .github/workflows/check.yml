name: check

# 本仓库的 CI：引擎单测 + 类型检查 + 容器内 entrypoint 行为测试。
#
# 结构说明（重要）
# ----------------
# 本仓是**单个服务**，但它 `import "../shared/abac.lume"` —— 引擎在兄弟目录里，
# 不在本仓内。所以 CI 必须把 kb-auth-shared 也检出到同级位置，否则 import 找不到。
#
#   $GITHUB_WORKSPACE/
#   ├── kb-auth/          ← 本仓（actions/checkout 默认落点）
#   └── shared/           ← kb-auth-shared，检出到这里
#
# lume 运行时从 GitHub Release 取官方静态二进制，不从源码编译：这样 CI 跑的
# 与用户 `make docker` 拿到的是同一个产物，且省掉整棵源码树的构建时间。

on:
  push:
  pull_request:

env:
  LUME_VERSION: v0.11.0

jobs:
  engine:
    # 无 docker：引擎四套断言（local/central/corrupt/grants）+ server.lume 类型检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kb-auth
        uses: actions/checkout@v4
        with:
          path: kb-auth

      - name: Checkout kb-auth-shared (engine, must sit as ../shared)
        uses: actions/checkout@v4
        with:
          repository: erishen/kb-auth-shared
          path: shared

      - name: Install lume runtime (official release)
        run: |
          set -eu
          ASSET="lume-linux-x64"
          BASE="https://github.com/erishen/lume/releases/download/${LUME_VERSION}"
          mkdir -p "$RUNNER_TEMP/lume"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lume/a.tar.gz"      "$BASE/$ASSET.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lume/$ASSET.sha256" "$BASE/$ASSET.sha256"
          cd "$RUNNER_TEMP/lume" && sha256sum -c "$ASSET.sha256"
          tar -xzf a.tar.gz
          sudo install -m755 "$ASSET/bin/lume" /usr/local/bin/lume
          lume --version

      - name: Engine tests + type-check
        working-directory: kb-auth
        run: make check

  entrypoint:
    # 唯一依赖 docker 的 job：entrypoint 跑在容器里（cryptpw/grep/sed 全是 busybox），
    # 宿主 macOS 复现不了。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kb-auth
        uses: actions/checkout@v4
        with:
          path: kb-auth

      - name: Checkout kb-auth-shared (engine, must sit as ../shared)
        uses: actions/checkout@v4
        with:
          repository: erishen/kb-auth-shared
          path: shared

      - name: Entrypoint behaviour tests (builds the image first)
        working-directory: kb-auth
        run: make entrypoint-test

  image:
    # 外部用户拿到仓库后的第一条路径：能不能构建、能不能起来。
    # 这条路径以前完全没被 CI 覆盖，也正是它一直在坏（依赖私有基础镜像）。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kb-auth
        uses: actions/checkout@v4
        with:
          path: kb-auth

      - name: Checkout kb-auth-shared (engine, must sit as ../shared)
        uses: actions/checkout@v4
        with:
          repository: erishen/kb-auth-shared
          path: shared

      - name: Build image
        working-directory: kb-auth
        run: docker compose build kb-auth

      - name: Smoke-test the running service
        working-directory: kb-auth
        run: |
          set -eu
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS -m 2 http://127.0.0.1:10097/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "--- health ---"
          curl -fsS http://127.0.0.1:10097/api/health; echo

          # entrypoint 会在首启生成随机 admin 口令并打进日志
          PW="$(docker logs kb-auth 2>&1 | sed -n 's/.*随机 admin 密码: \([a-f0-9]*\).*/\1/p' | head -1)"
          test -n "$PW" || { echo "没有从日志取到 admin 口令"; docker compose logs; exit 1; }

          echo "--- 未认证访问应 401 ---"
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10097/api/accounts)"
          echo "$code"; test "$code" = "401"

          echo "--- 认证后可列账号 ---"
          curl -fsS -u "admin:$PW" http://127.0.0.1:10097/api/accounts | head -c 200; echo

          echo "--- 跨项目决策（未授权学段应 DENY）---"
          out="$(curl -fsS -u "admin:$PW" -X POST http://127.0.0.1:10097/api/authorize \
            -H 'content-type: application/json' \
            -d '{"project":"project-a","user":"alice","res":"stage","action":"read","stage":"stage-c"}')"
          echo "$out"; echo "$out" | grep -q '"decision":"DENY"'

          echo "--- 已授权学段应 PERMIT ---"
          out="$(curl -fsS -u "admin:$PW" -X POST http://127.0.0.1:10097/api/authorize \
            -H 'content-type: application/json' \
            -d '{"project":"project-a","user":"alice","res":"stage","action":"read","stage":"stage-a"}')"
          echo "$out"; echo "$out" | grep -q '"decision":"PERMIT"'

          docker compose down
